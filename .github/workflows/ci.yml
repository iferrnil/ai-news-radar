name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint · typecheck · static build · Go server · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
      - name: Go server (CGO_ENABLED=0)
        working-directory: server
        run: CGO_ENABLED=0 go build -o bin/radar-server ./cmd/radar-server
      - run: npx playwright install --with-deps chromium
      - name: Playwright suite (fresh DB, mocked upstream)
        env:
          E2E_LOG: ${{ runner.temp }}/server.log
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: bash e2e/runall.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/server.log
          if-no-files-found: ignore

  server:
    name: Server (gofmt · go vet · go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...

  desktop:
    name: Desktop (go vet · go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            server/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
