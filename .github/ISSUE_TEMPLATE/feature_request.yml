name: 功能建议 / Feature request
description: 新功能、新信息源或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 新信息源请附 RSS/Atom 或 JSON API 地址（不接受 HTML 爬取）
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的方案
